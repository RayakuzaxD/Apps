name: Pavio CI

on:
  push:
    paths: ['pavio/**', '.github/workflows/pavio-ci.yml']
  pull_request:
    paths: ['pavio/**', '.github/workflows/pavio-ci.yml']

defaults:
  run:
    working-directory: pavio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pavio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: pavio/test-results
