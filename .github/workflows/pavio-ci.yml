name: Pavio CI

on:
  push:
    paths: ['pavio/**', '.github/workflows/pavio-ci.yml']
  pull_request:
    paths: ['pavio/**', '.github/workflows/pavio-ci.yml']
  workflow_dispatch:
  # Dados macro e on-chain do dia (FRED, Coin Metrics): atualiza e republica o site.
  schedule:
    - cron: '17 9 * * *'

defaults:
  run:
    working-directory: pavio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pavio/package-lock.json
      - run: npm ci
      - run: npm run check
      # Só no main: os PRs não dependem de fontes externas (os e2e usam dados simulados).
      - name: Baixar dados macro e on-chain
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run data
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: pavio/test-results
      # O dist/ publicado é o mesmo que passou nos testes e2e.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: pavio/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
